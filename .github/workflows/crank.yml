name: crank

on:
  schedule:
    - cron: "0 * * * *" # hourly; a no-op run costs ~30s of Actions time
  workflow_dispatch:

concurrency:
  group: crank
  cancel-in-progress: false

env:
  STAKE_POOL: DqhH94PjkZsjAqEze2BEkWhFQJ6EyU6MdtMphMgnXqeK
  # microlamports per compute unit. crank.py asks ~195k CU per 11-validator tx, so 50_000
  # is ~10_000 lamports priority per tx: ~0.003 SOL per full crank of ~185 txs with base fees.
  COMPUTE_UNIT_PRICE: ${{ vars.COMPUTE_UNIT_PRICE || '50000' }}
  MIN_FEE_PAYER_SOL: ${{ vars.MIN_FEE_PAYER_SOL || '0.2' }}

jobs:
  crank:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      # Packs 11 validators per tx and retries per tx until the pool is current or the
      # budget runs out. See crank.py for why it survives a flaky RPC.
      - name: Update stake pool
        run: python3 crank.py
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          FEE_PAYER_KEYPAIR: ${{ secrets.FEE_PAYER_KEYPAIR }}
          # 22 min fits the 30 min job timeout with room for check.py.
          CRANK_BUDGET_SECONDS: 1320

      - name: Verify pool is current and fee payer is funded
        if: always()
        run: python3 check.py
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          FEE_PAYER_KEYPAIR: ${{ secrets.FEE_PAYER_KEYPAIR }}

      # Optional: add a SLACK_WEBHOOK_URL secret (Slack app -> Incoming Webhooks) to get pinged
      # on any red run. Does nothing until the secret exists.
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "no SLACK_WEBHOOK_URL set, skipping"; exit 0; }
          curl -sS -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK_URL" \
            --data "$(printf '{"text":":rotating_light: stake-pool-cranker run failed (pool stale or fee payer low). %s"}' "$RUN_URL")"
